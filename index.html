<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerical Methods Solver</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css')}}">
</head>
<body>

<header>Numerical Methods</header>

<div class="container">
    <div class="menu">
        <h3>Chapter 1</h3>
        <button onclick="selectAlgorithm('Bisection')">Bisection</button>
        <button onclick="selectAlgorithm('False Position')">False Position</button>
        <button onclick="selectAlgorithm('Fixed Point')">Fixed Point</button>
        <button onclick="selectAlgorithm('Newton')">Newton</button>
        <button onclick="selectAlgorithm('Secant')">Secant</button>

        <h3>Chapter 2</h3>
        <button onclick="selectAlgorithm('Gaussian')">Gaussian</button>
        <button onclick="selectAlgorithm('LU')">LU</button>

        <h3>Chapter 3</h3>
        <button onclick="selectAlgorithm('Interpolation')">Interpolation</button>
        <button onclick="selectAlgorithm('Trapezoidal')">Trapezoidal</button>
        <button onclick="selectAlgorithm('Simpson')">Simpson</button>
    </div>

    <div class="main">
        <h2 id="title">Select a Method</h2>
        <div id="inputs"></div>
        <div class="btns">
            <button class="solve-btn" onclick="solve()">Solve</button>
            <button class="clear-btn" onclick="clearInputs()">Clear</button>
        </div>

        <div id="result-container">
            <div id="result"></div>
        </div>
    </div>
</div>

<script src="{{ url_for('static' , filename='main.js')}}"></script>
</body>
</html>
